name: Deploy to Fabric

# Manual-only, protected-environment deployment. This workflow requires
# the "production" GitHub Environment to be configured with required
# reviewers -- see docs/DEPLOYMENT.md. It is never triggered automatically
# by a push; an approver must explicitly run it via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to publish workspace/ to the target Fabric workspace.'
        required: true
        type: string

permissions:
  id-token: write   # required for azure/login OIDC federated credential
  contents: read

jobs:
  deploy:
    name: Publish Sales sample to Fabric
    runs-on: ubuntu-latest
    environment: production   # protected environment with required reviewers
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run structural validation before deploying
        run: python scripts/validate_pbip.py

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Fabric workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
          FABRIC_ENVIRONMENT: ${{ vars.FABRIC_ENVIRONMENT }}
        run: python scripts/deploy_to_fabric.py

      - name: Verify deployment
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: python scripts/validate_deployment.py
