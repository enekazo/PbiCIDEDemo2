name: PR Validation

# Runs on every pull request. No secrets or Azure credentials are used --
# this workflow only performs structural/static checks against the files
# in the repository so it is safe to run on forks and untrusted PRs.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, validate PBIP structure, run unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check scripts tests

      - name: Validate PBIP structure (workspace/)
        run: python scripts/validate_pbip.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Validate workflow YAML
        run: python -c "import yaml, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]; print('Workflow YAML is valid.')"
